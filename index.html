<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Photographs and places by Saumit Madireddy.">
  <title>Saumit Madireddy — Photography</title>
  <link rel="stylesheet" href="styles.css">
  <script src="albums.js" defer></script>
  <script src="site.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to photographs</a>
  <aside class="sidebar">
    <a class="name" href="index.html">Saumit<br>Madireddy</a>
    <nav aria-label="Photo albums" id="albums"></nav>
    <a class="about-link" href="about.html">about</a>
    <div class="socials">
      <a href="mailto:madireddysaumit@gmail.com" aria-label="Email Saumit"><svg viewBox="2.25 4.25 19.5 15.5" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1"/><path d="m3 6 9 7 9-7"/></svg></a>
      <a href="https://www.instagram.com/saumxt/" aria-label="Instagram"><svg viewBox="2.25 2.25 19.5 19.5"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle class="solid" cx="17.5" cy="6.5" r="1"/></svg></a>
      <a href="https://letterboxd.com/saumit/" aria-label="Letterboxd"><svg class="letterboxd-logo" viewBox="5.2 9.4 13.6 5.2" aria-hidden="true"><g fill="currentColor" stroke="none"><circle cx="7.8" cy="12" r="2.6"/><circle cx="12" cy="12" r="2.6"/><circle cx="16.2" cy="12" r="2.6"/></g><path fill="#fff" stroke="none" d="M9.9 10.467a2.6 2.6 0 0 1 0 3.066 2.6 2.6 0 0 1 0-3.066Zm4.2 0a2.6 2.6 0 0 1 0 3.066 2.6 2.6 0 0 1 0-3.066Z"/></svg></a>
    </div>
    <div class="gallery-controls" aria-label="Photograph controls">
      <div class="photo-navigation">
        <button id="previous" type="button">prev</button><span aria-hidden="true">/</span><button id="next" type="button">next</button>
      </div>
      <button id="grid-toggle" type="button" aria-label="View album gallery" aria-controls="grid" aria-expanded="false"><span>show gallery</span></button>
    </div>
  </aside>
  <main id="main" tabindex="-1">
    <section class="gallery" aria-label="Photo gallery">
      <div class="photo-stage"><img id="photo" src="website-photos/Albania/1_Albania.jpeg" alt="Albania, photograph 1"></div>
      <p class="sr-only" id="photo-status" aria-live="polite"></p>
    </section>
    <section id="grid" class="photo-grid" aria-label="Album photographs" hidden></section>
    <noscript>Please enable JavaScript to browse the photo albums.</noscript>
  </main>
</body>
</html>
