<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>Saumit Madireddy — Photography</title>
  <link rel="stylesheet" href="styles.css?v=desktop-contact-20">

  <script src="site.js?v=desktop-contact-20" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to photographs</a>
  <aside class="sidebar">
    <a class="name" href="index.html">Saumit<br>Madireddy</a>
    <div class="menu-bar">
      <nav aria-label="Photo albums" id="albums"></nav>
      <nav aria-label="Personal links" id="personal-menu" class="personal-menu">
        <a href="video.html" data-page="video">video</a>
        <a href="about.html" data-page="about">about</a>
        <a href="tmi.html" data-page="tmi">tmi</a>
        <a href="mailto:madireddysaumit@gmail.com">email</a>
        <a href="https://www.instagram.com/saumxt/">insta</a>
        <a href="https://letterboxd.com/saumit/">letterboxd</a>
      </nav>
      <button class="menu-switch" type="button" aria-label="Show personal links" aria-controls="albums personal-menu" aria-pressed="false"></button>
    </div>
    <button class="desktop-menu-switch" type="button" aria-label="Show personal links" aria-expanded="false" aria-controls="desktop-personal-links"></button>
    <div class="desktop-personal-links" id="desktop-personal-links" hidden>
      <a class="about-link" href="about.html">about</a>
      <a href="tmi.html" data-desktop-page="tmi">tmi</a>
      <div class="desktop-contact-row">
        <button class="desktop-contact-label" type="button" aria-expanded="false" aria-controls="desktop-contact-email desktop-contact-links">contact</button>
        <a id="desktop-contact-email" href="mailto:madireddysaumit@gmail.com" hidden>email</a>
        <button class="desktop-contact-switch" type="button" aria-label="Show contact links" aria-expanded="false" aria-controls="desktop-contact-email desktop-contact-links"></button>
      </div>
      <div class="desktop-contact-links" id="desktop-contact-links" hidden>
      <a href="https://www.instagram.com/saumxt/">instagram</a>
      <a href="https://letterboxd.com/saumit/">letterboxd</a>
      </div>
    </div>
    <div class="gallery-controls" aria-label="Photograph controls">
      <div class="photo-navigation">
        <button id="previous" type="button">prev</button><span aria-hidden="true">/</span><button id="next" type="button">next</button>
      </div>
      <button id="grid-toggle" type="button" aria-label="View album gallery" aria-controls="grid" aria-expanded="false"><span>show gallery</span></button>
    </div>
  </aside>
  <main id="main" tabindex="-1">
    <section class="gallery" aria-label="Photo gallery">
      <div class="photo-stage"><img id="photo" src="website-photos/Albania/1_Albania.jpeg" alt="Albania, photograph 1"></div>
      <p class="sr-only" id="photo-status" aria-live="polite"></p>
    </section>
    <section id="grid" class="photo-grid" aria-label="Album photographs" hidden></section>
    <noscript>Please enable JavaScript to browse the photo albums.</noscript>
  </main>
</body>
</html>
